<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruh Tube</title>
<style>
  :root {
    --bg: #0f0f12; --panel: #1a1a20; --line: #2a2a33; --text: #ececf1;
    --muted: #9a9aa8; --accent: #ff3b5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 16px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; cursor: pointer; }
  h1 span { color: var(--accent); }
  form { flex: 1; display: flex; gap: 8px; min-width: 240px; }
  input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  button, select { padding: 10px 16px; border-radius: 999px; border: 0;
    background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  select { background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  #status { color: var(--muted); margin: 8px 0 16px; min-height: 1.4em; }
  #grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { cursor: pointer; background: var(--panel); border-radius: 12px; overflow: hidden; }
  .card:hover { outline: 2px solid var(--accent); }
  .thumb { position: relative; aspect-ratio: 16/9; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8);
    padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .meta { padding: 10px 12px; }
  .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #player { display: none; margin-bottom: 20px; }
  #player.on { display: block; }
  .frame { aspect-ratio: 16/9; width: 100%; background: #000; border-radius: 12px; overflow: hidden; }
  .frame iframe { width: 100%; height: 100%; border: 0; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .bar h2 { flex: 1; font-size: 18px; margin: 0; min-width: 200px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 16px; }
</style>
</head>
<body>
<header>
  <h1 id="home">Bruh<span>Tube</span></h1>
  <form id="search">
    <input id="q" placeholder="Search, or paste a YouTube link" autocomplete="off">
    <button>Go</button>
  </form>
</header>

<main>
  <section id="player">
    <div class="frame"><iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <div class="bar">
      <h2 id="ptitle"></h2>
      <label class="sub">Source
        <select id="source"></select>
      </label>
    </div>
  </section>
  <div id="status"></div>
  <div id="grid"></div>
</main>

<footer id="foot"></footer>

<script>
const $ = (id) => document.getElementById(id);
let instances = [];
let current = null; // { id, title }

function fmtDur(s) {
  if (!s) return "";
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}
function fmtViews(n) {
  if (n == null) return "";
  return Intl.NumberFormat("en", { notation: "compact" }).format(n) + " views";
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function videoIdFrom(text) {
  const t = text.trim();
  if (/^[\w-]{11}$/.test(t)) return t;
  try {
    const u = new URL(t);
    if (u.hostname.endsWith("youtu.be")) return u.pathname.slice(1, 12);
    if (u.searchParams.get("v")) return u.searchParams.get("v");
    const m = u.pathname.match(/\/(?:embed|shorts|live|v)\/([\w-]{11})/);
    if (m) return m[1];
  } catch {}
  return null;
}

// Try each working instance in turn until one answers.
async function api(path) {
  let lastErr;
  for (const base of instances) {
    try {
      const res = await fetch(base + path, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      // Remember the one that worked so it's tried first next time.
      instances = [base, ...instances.filter((b) => b !== base)];
      return data;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("no instances");
}

function render(list) {
  const vids = list.filter((v) => v.type === "video" || (!v.type && v.videoId));
  $("grid").innerHTML = vids.map((v) => `
    <div class="card" data-id="${esc(v.videoId)}" data-title="${esc(v.title)}">
      <div class="thumb">
        <img loading="lazy" src="https://i.ytimg.com/vi/${esc(v.videoId)}/mqdefault.jpg" alt="">
        <span class="dur">${v.liveNow ? "LIVE" : fmtDur(v.lengthSeconds)}</span>
      </div>
      <div class="meta">
        <div class="title">${esc(v.title)}</div>
        <div class="sub">${esc(v.author)}${v.viewCount != null ? " · " + fmtViews(v.viewCount) : ""}</div>
      </div>
    </div>`).join("");
  $("status").textContent = vids.length ? "" : "No results.";
}

async function search(q) {
  $("status").textContent = "Searching…";
  try {
    render(await api(`/api/v1/search?q=${encodeURIComponent(q)}&type=video`));
  } catch {
    $("status").textContent = "Search is down on every instance right now. You can still paste a YouTube link.";
    $("grid").innerHTML = "";
  }
}

async function trending() {
  $("status").textContent = "Loading popular videos…";
  try { render(await api("/api/v1/popular")); }
  catch {
    try { render(await api("/api/v1/trending")); }
    catch { $("status").textContent = "Search for something above, or paste a YouTube link."; }
  }
}

function sources() {
  return [
    { label: "YouTube (no-cookie)", url: (id) => `https://www.youtube-nocookie.com/embed/${id}?autoplay=1` },
    ...instances.map((b) => ({ label: new URL(b).hostname, url: (id) => `${b}/embed/${id}?autoplay=1&local=true` })),
  ];
}

function play(id, title = "") {
  current = { id, title };
  const sel = $("source");
  const srcs = sources();
  const saved = localStorageGet("source");
  sel.innerHTML = srcs.map((s, i) => `<option value="${i}">${esc(s.label)}</option>`).join("");
  const idx = Math.max(0, srcs.findIndex((s) => s.label === saved));
  sel.value = idx;
  $("frame").src = srcs[idx].url(id);
  $("ptitle").textContent = title;
  $("player").classList.add("on");
  scrollTo({ top: 0, behavior: "smooth" });
  if (location.hash !== "#v=" + id) history.replaceState(null, "", "#v=" + id);
  if (!title) api(`/api/v1/videos/${id}?fields=title`).then((d) => {
    if (current?.id === id) $("ptitle").textContent = d.title;
  }).catch(() => {});
}

function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

$("source").onchange = (e) => {
  const s = sources()[e.target.value];
  localStorageSet("source", s.label);
  if (current) $("frame").src = s.url(current.id);
};
$("grid").onclick = (e) => {
  const card = e.target.closest(".card");
  if (card) play(card.dataset.id, card.dataset.title);
};
$("search").onsubmit = (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  const id = videoIdFrom(q);
  id ? play(id) : search(q);
};
$("home").onclick = () => {
  $("player").classList.remove("on");
  $("frame").src = "about:blank";
  history.replaceState(null, "", location.pathname);
  trending();
};

(async () => {
  try {
    const data = await (await fetch("instances.json", { cache: "no-store" })).json();
    instances = data.instances || [];
    if (data.updated) $("foot").textContent =
      `${instances.length} servers · list auto-updated ${new Date(data.updated).toLocaleString()}`;
  } catch {}
  const m = location.hash.match(/v=([\w-]{11})/);
  if (m) play(m[1]);
  trending();
})();
</script>
</body>
</html>
