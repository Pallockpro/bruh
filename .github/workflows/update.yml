name: Auto-update instances

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - scripts/update-instances.mjs
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-instances
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-instances.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- instances.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instances.json
          git commit -m "Auto-update working instances"
          git push
